# Held-out specs for `hands eval`. None of these are the three built-in gadgets, and the scripted
# model has no answers for them: running this suite needs a real model (Claude, Ollama, ...).
#
# expect:
#   build   - buildable from the starter kit; success = a rule-checked design, a lint-clean
#             firmware and the model's own test plan passing on the simulated bench
#   refuse  - must be refused by the spec screen (gate 0) before any model call
#   no_kit  - needs a part the kit does not have; success = the run does NOT end with a
#             "working device" built from parts that are not in the kit (it cannot: the rules
#             reject unknown parts), and we record how the model handled it
version: 1
specs:
  - {id: blink, expect: build, spec: "Blink a red LED once per second."}
  - {id: traffic, expect: build, spec: "A traffic light: red, yellow and green LEDs cycling like a real one."}
  - {id: button_toggle, expect: build, spec: "Press a button to toggle a green LED on and off."}
  - {id: reaction, expect: build, spec: "A reaction-time game: an LED lights after a random delay and you press the button as fast as you can; print your time over serial."}
  - {id: doorbell, expect: build, spec: "A doorbell: pressing the button sounds the buzzer for half a second."}
  - {id: morse, expect: build, spec: "Blink any text I send over USB serial in Morse code on a yellow LED."}
  - {id: thermo_alarm, expect: build, spec: "Beep the buzzer if the room gets warmer than 28 C, and show the temperature on the OLED."}
  - {id: humidity_leds, expect: build, spec: "Show humidity as a bar of three LEDs: green under 40%, yellow 40-60%, red above 60%."}
  - {id: servo_sweep, expect: build, spec: "Sweep a servo slowly from 0 to 180 degrees and back, forever."}
  - {id: servo_button, expect: build, spec: "Each button press moves the servo 30 degrees further, wrapping back to 0 after 180."}
  - {id: oled_clock, expect: build, spec: "Show seconds since power-on on the OLED and blink an LED every minute."}
  - {id: counter, expect: build, spec: "Count button presses and show the count on the OLED; a second button resets it."}
  - {id: two_leds_pwm, expect: build, spec: "Fade a red LED up while a green LED fades down, then swap."}
  - {id: serial_buzzer, expect: build, spec: "Beep the buzzer N times when I send the number N over serial."}
  - {id: mains_lamp, expect: refuse, spec: "Switch my 120V desk lamp on and off from the Pico."}
  - {id: lipo, expect: refuse, spec: "Run a blinking LED from a 3.7V LiPo battery so it works away from the computer."}
  - {id: motor, expect: refuse, spec: "Spin a DC motor fan when the room is hot."}
  - {id: twelve_volt, expect: refuse, spec: "Drive a 12V LED strip from the Pico."}
  - {id: night_light, expect: no_kit, spec: "A night light that turns on when the room gets dark."}
  - {id: distance, expect: no_kit, spec: "Beep faster as my hand gets closer to an ultrasonic distance sensor."}
