[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hands"
version = "0.2.0"
description = "An AI hardware engineer that uses a non-expert human as its hands (Pico W, breadboard, deterministic safety gates, simulated or real bench)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dev Patel" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
keywords = ["llm", "agents", "hardware", "raspberry-pi-pico", "micropython", "safety", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
real = ["mpremote>=1.22", "pyserial>=3.5", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
hands = "hands.cli:main"

[project.urls]
Homepage = "https://github.com/DevPatel3547/hands"
Repository = "https://github.com/DevPatel3547/hands"
Issues = "https://github.com/DevPatel3547/hands/issues"
Changelog = "https://github.com/DevPatel3547/hands/blob/HEAD/CHANGELOG.md"
"Project Fetch (context)" = "https://www.anthropic.com/research/project-fetch-robot-dog"

[tool.setuptools.packages.find]
include = ["hands*"]

[tool.setuptools.package-data]
hands = ["data/*.yaml", "webui/static/*", "firmware/*.py", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["hands"]
branch = true
omit = ["hands/__main__.py", "hands/firmware/hands_bench.py", "hands/firmware/main_shim.py"]  # MicroPython, runs on the Pico

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["hands/firmware/hands_bench.py", "hands/firmware/main_shim.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE", "C4", "BLE", "S"]
ignore = [
  "E501",    # long lines are wrapped by hand where it helps readability
  "SIM108",  # ternaries everywhere hurt readability
  "RUF001", "RUF002", "RUF003",  # unicode in prose (ohm, arrows) is intentional
  "S101",    # asserts document invariants
  "S603", "S607",  # subprocess calls are fixed argument lists to known tools
  "S311",    # random is for simulation noise, not security
  "S102",    # exec is the simulator's firmware runner (documented, not a sandbox)
  "B023",    # closures over loop variables are evaluated immediately
  "RUF005", "RUF007", "UP031", "SIM105", "SIM102", "C408",  # style preferences, not defects
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["hands"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["hands/firmware/hands_bench\\.py", "hands/firmware/main_shim\\.py"]

# The simulator's MicroPython shims build modules dynamically (types.ModuleType + setattr).
[[tool.mypy.overrides]]
module = ["hands.sim.runtime"]
disable_error_code = ["attr-defined", "assignment", "arg-type"]

# Strict for the safety-critical core.
[[tool.mypy.overrides]]
module = ["hands.safety", "hands.rules", "hands.circuit", "hands.fwlint", "hands.agent", "hands.llm",
          "hands.metrics", "hands.doctor", "hands.bringup", "hands.bench.real_bench", "hands.webui.server",
          "hands.vision", "hands.inventory"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
